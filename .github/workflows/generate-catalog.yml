name: Generate static catalog

on:
  push:
    paths:
      - 'materiale-pubblico/**'
      - 'generate-catalog.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate catalog
        run: node generate-catalog.js

      - name: Commit catalog
        run: |
          if git diff --quiet -- catalogo.json; then
            echo "catalogo.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          git commit -m "chore: update static catalog"
          git push
